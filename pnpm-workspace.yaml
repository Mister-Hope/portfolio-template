virtualStoreType: global

# Supply-chain cooldown: do not install packages published less than a day ago.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@mdit/*"
  - "@mr-hope/*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@vitest/*"
  - "@vue/*"
  - oxc-config-hope
  - oxfmt
  - oxlint
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyIgnoreAfter: 720
