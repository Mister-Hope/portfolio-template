name: Bug report
description: Report a bug in the template
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please include your config format (`ts`/`js`/`json`/`yml`/`yaml`) and the exact commands you ran.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal config snippet + commands, or a repository link.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Template version / commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
