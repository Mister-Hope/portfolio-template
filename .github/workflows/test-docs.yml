name: Test Docs

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.20.0

      - name: Install Dependencies
        run: pnpm ci

      - name: Copy Config
        if: github.repository == 'Mister-Hope/portfolio-template'
        run: |-
          cp examples/config.example.yml config.yml

      - name: Build Docs
        run: |-
          pnpm run build
