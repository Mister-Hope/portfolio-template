name: Test Docs

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Copy Config
        run: |
          has_config=false
          for f in config.ts config.js config.json config.yml config.yaml; do
            [ -f "$f" ] && has_config=true && break
          done
          if [ "$has_config" = "false" ]; then
            cp examples/config.example.yml config.yml
          fi

      - name: Build Docs
        run: |-
          pnpm run build

      - name: Run Tests
        run: pnpm test
