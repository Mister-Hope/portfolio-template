name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      base_commit:
        description: "Upstream commit to sync from (leave empty to detect it automatically)"
        required: false
        type: string
      depth:
        description: "How many upstream commits to scan when detecting the base commit"
        required: false
        default: "300"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run on forks, not the original template repository
    if: github.repository != 'Mister-Hope/portfolio-template'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Mister-Hope/portfolio-template.git
          git fetch --no-tags upstream main

      - name: Create sync branch
        run: git checkout -B sync-upstream

      - name: Sync template changes
        id: sync
        env:
          BASE_COMMIT: ${{ inputs.base_commit }}
          DEPTH: ${{ inputs.depth }}
        run: |
          args=(
            --repo "$GITHUB_WORKSPACE"
            --upstream upstream/main
            --report "$RUNNER_TEMP/sync-report.md"
            --summary "$RUNNER_TEMP/sync-summary.json"
          )

          [ -n "$BASE_COMMIT" ] && args+=(--base "$BASE_COMMIT")
          [ -n "$DEPTH" ] && args+=(--depth "$DEPTH")

          node .github/scripts/sync-upstream.mjs "${args[@]}"

      - name: Update lockfile
        if: steps.sync.outputs.package_json_changed == 'true'
        run: pnpm install --lockfile-only

      - name: Commit changes
        id: commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync with upstream Mister-Hope/portfolio-template"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Force push to sync-upstream branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin sync-upstream --force

      - name: Create or update Pull Request
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')

            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/sync-report.md`, 'utf8')
            const title = 'chore: sync with upstream Mister-Hope/portfolio-template'
            const { owner, repo } = context.repo

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:sync-upstream`,
              base: 'main',
              state: 'open',
            })

            if (prs.length > 0) {
              await github.rest.pulls.update({ owner, repo, pull_number: prs[0].number, body })
              core.info(`Updated pull request #${prs[0].number}`)
            } else {
              try {
                const { data: pr } = await github.rest.pulls.create({
                  owner,
                  repo,
                  title,
                  head: 'sync-upstream',
                  base: 'main',
                  body,
                })
                core.info(`Created pull request #${pr.number}`)
              } catch (err) {
                if (err.status === 403) {
                  core.error(
                    'Failed to create pull request: GitHub Actions is not permitted to create pull requests in this repository.\n' +
                    'To fix this, go to your repository Settings → Actions → General → Workflow permissions\n' +
                    'and enable "Allow GitHub Actions to create and approve pull requests".\n' +
                    'The sync-upstream branch has been pushed and you can open the PR manually:\n' +
                    `https://github.com/${owner}/${repo}/compare/main...sync-upstream`
                  )
                  core.setFailed('PR creation blocked by repository settings. See the error message above for instructions.')
                } else {
                  throw err
                }
              }
            }
