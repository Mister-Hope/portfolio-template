name: Linter Test

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run linter on the main repository
    # We can not force users to satisfy our linter rules on forks with their configurations
    if: github.repository == 'Mister-Hope/portfolio-template'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^26.13.0
          require-lockfile: true

      - name: Run linter
        run: pnpm run lint:check

      # The test suite covers the template source and builds the example configs, so it only runs
      # here: forks customize the source, and synced test files would not match it.
      - name: Run tests
        run: pnpm test
