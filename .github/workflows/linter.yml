name: Linter Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Only run linter on the main repository
    # We can not force users to satisfy our linter rules on forks with their configurations
    if: github.repository == 'Mister-Hope/portfolio-template'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.20.0

      - name: Install Dependencies
        run: pnpm ci

      - name: Run linter
        run: pnpm run lint
